[project]
name = "search-engine-for-the-test-assignment"
version = "0.1.0"
description = ""
authors = [
    {name = "Tim1ro",email = "artem.gr.2006@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "elasticsearch (>=9.5.1,<10.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
