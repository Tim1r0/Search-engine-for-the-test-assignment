services:
  pg:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: esearch
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d esearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build: .
    working_dir: /app/app
    command: sh -c "alembic upgrade head && python main.py"
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      - E_SEARCH__DB__URL=postgresql+asyncpg://user:user@pg:5432/esearch
      - E_SEARCH__ES__URL=http://es:9200/
    depends_on:
      pg:
        condition: service_healthy
      es:
        condition: service_healthy

volumes:
  pg_data:
  es_data: